<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>匯入使用者 (Excel)</title>
    <style>
        body { font-family: ***REMOVED***ns-serif; margin: 20px; background-color: #f4f4f4; }
        .container { background-color: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        input[type="file"] { margin-bottom: 10px; }
        button { padding: 10px 15px; background-color: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background-color: #0056b3; }
        #uploadMes***REMOVED***ges { margin-top: 20px; padding: 10px; border: 1px solid #ccc; border-radius: 4px; background-color: #e9e9e9; max-height: 300px; overflow-y: auto;}
        #uploadMes***REMOVED***ges div { padding: 5px 0; border-bottom: 1px solid #ddd; }
        #uploadMes***REMOVED***ges div:last-child { border-bottom: none; }
        .success { color: green; }
        .error { color: red; }
        .warning { color: orange; }
    </style>
</head>
<body>
    <div class="container">
        <h1>從 Excel 匯入使用者</h1>
        <form id="uploadForm" enctype="multipart/form-data">
            <input type="file" name="file" id="fileInput" accept=".xls,.xlsx" required>
            <button type="submit">上傳並匯入</button>
        </form>
        <div id="uploadMes***REMOVED***ges" style="display:none;">
            <h3>匯入結果：</h3>
            <div id="mes***REMOVED***gesList"></div>
        </div>
    </div>

    <script>
        document.getElementById('uploadForm').addEventListener('submit', async function(event) {
            event.preventDefault();
            const fileInput = document.getElementById('fileInput');
            const mes***REMOVED***gesListDiv = document.getElementById('mes***REMOVED***gesList');
            const uploadMes***REMOVED***gesDiv = document.getElementById('uploadMes***REMOVED***ges');

            mes***REMOVED***gesListDiv.innerHTML = ''; // 清空先前的訊息
            uploadMes***REMOVED***gesDiv.style.display = 'none';

            if (fileInput.files.length === 0) {
                alert('請選擇一個檔案！');
                return;
            }

            const formData = new FormData();
            formData.append('file', fileInput.files[0]);

            try {
                const response = await fetch('/api/users/upload-excel', {
                    method: 'POST',
                    body: formData
                    // 不需要 'Content-Type' 標頭，瀏覽器會自動為 FormData 設定
                });

                const results = await response.json(); // 假設後端回傳 JSON 陣列的字串

                if (results && results.length > 0) {
                    results.forEach(msg => {
                        const p = document.createElement('div');
                        p.textContent = msg;
                        if (msg.startsWith('成功')) {
                            p.className = 'success';
                        } else if (msg.startsWith('錯誤')) {
                            p.className = 'error';
                        } else if (msg.startsWith('警告')) {
                            p.className = 'warning';
                        }
                        mes***REMOVED***gesListDiv.appendChild(p);
                    });
                } else {
                     mes***REMOVED***gesListDiv.innerHTML = '<div>沒有收到匯入結果。</div>';
                }
                 uploadMes***REMOVED***gesDiv.style.display = 'block';

            } catch (error) {
                console.error('上傳失敗:', error);
                mes***REMOVED***gesListDiv.innerHTML = `<div class="error">上傳或處理檔案時發生錯誤: ${error.mes***REMOVED***ge}</div>`;
                uploadMes***REMOVED***gesDiv.style.display = 'block';
            }
        });
    </script>
</body>
</html>
