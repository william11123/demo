<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PredictUpload 前端</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #f4f4f4;
            color: #333;
        }
        .container {
            background-color: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        h1, h2 {
            color: #333;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }
        input[type="file"] {
            margin-bottom: 15px;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
            width: calc(100% - 20px);
        }
        button {
            background-color: #007bff;
            color: white;
            padding: 10px 15px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background-color: #0056b3;
        }
        #messages {
            margin-top: 20px;
            padding: 10px;
            border: 1px solid #eee;
            background-color: #f9f9f9;
            border-radius: 4px;
            min-height: 50px;
        }
        #messages ul {
            list-style-type: none;
            padding: 0;
        }
        #messages li {
            padding: 5px 0;
            border-bottom: 1px dashed #eee;
        }
        #messages li:last-child {
            border-bottom: none;
        }
        .error {
            color: red;
            font-weight: bold;
        }
        .warning {
            color: orange;
        }
        .success {
            color: green;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>PredictUpload 資料管理</h1>

        <section id="excel-upload-section">
            <h2>從 Excel 匯入 PredictUpload 資料</h2>
            <div>
                <label for="excelFile">選擇 Excel 檔案 (.xls 或 .xlsx):</label>
                <input type="file" id="excelFile" name="excelFile" accept=".xls,.xlsx">
            </div>
            <button onclick="uploadExcel()">上傳檔案</button>
            <div id="uploadMessagesTitle" style="margin-top: 15px; font-weight: bold; display: none;">匯入結果:</div>
            <div id="messages">
                <ul></ul>
            </div>
        </section>

        <section id="create-manual-record-section" style="margin-top: 30px;">
            <h2>手動建立新的 PredictUpload 記錄</h2>
            <div>
                <label for="manualCustomNo">CustomNo (必填):</label>
                <input type="text" id="manualCustomNo" name="manualCustomNo" required>
            </div>
            <div>
                <label for="manualTaskType">TaskType (必填):</label>
                <input type="text" id="manualTaskType" name="manualTaskType">
            </div>
            <div>
                <label for="manualInMonth">InMonth (必填):</label>
                <input type="text" id="manualInMonth" name="manualInMonth">
            </div>
            <div>
                <label for="manualIncome">Income (必填):</label>
                <input type="number" id="manualIncome" name="manualIncome" required>
            </div>
            <button onclick="createManualRecord()">建立記錄</button>
            <div id="manualCreateResult" style="margin-top: 10px;"></div>
        </section>

            <section id="get-record-section">
                <h2>根據 CustomNo 查詢記錄</h2>
                <p><em>(後端對應的 @GetMapping(\"/customNo/{customNo}\") 端點目前未啟用)</em></p>
                <label for="searchCustomNo">輸入 CustomNo:</label>
                <input type="text" id="searchCustomNo" name="searchCustomNo"><br>
                <button onclick="getRecordByCustomNo()">查詢</button>
                <div id="getResult"></div>
            </section>

            <section id="get-all-records-section">
                <h2>查詢所有記錄</h2>
                <p><em>(後端對應的 @GetMapping 端點目前未啟用)</em></p>
                <button onclick="getAllRecords()">查詢全部</button>
                <div id="getAllResult"></div>
            </section>
        -->

    </div>

    <script>
        const messagesDiv = document.getElementById('messages').getElementsByTagName('ul')[0];
        const uploadMessagesTitle = document.getElementById('uploadMessagesTitle');

        async function uploadExcel() {
            const fileInput = document.getElementById('excelFile');
            messagesDiv.innerHTML = ''; // 清空先前的訊息
            uploadMessagesTitle.style.display = 'none';


            if (fileInput.files.length === 0) {
                appendMessage('請先選擇一個檔案。', 'error');
                uploadMessagesTitle.style.display = 'block';
                return;
            }

            const file = fileInput.files[0];
            const formData = new FormData();
            formData.append('file', file); // 'file' 必須與 @RequestParam("file") 的名稱相符

            try {
                // 確保您的 Spring Boot 應用程式正在執行，並且此 URL 是可訪問的
                const response = await fetch('/api/predict-uploads/upload-excel', {
                    method: 'POST',
                    body: formData,
                    // 不需要 'Content-Type': 'multipart/form-data'，瀏覽器會自動設定
                });

                uploadMessagesTitle.style.display = 'block';
                const resultMessages = await response.json();

                if (response.ok || response.status === 207) { // 207 Multi-Status
                    if (Array.isArray(resultMessages)) {
                        resultMessages.forEach(msg => {
                            let type = 'info';
                            if (msg.startsWith('錯誤')) type = 'error';
                            else if (msg.startsWith('警告')) type = 'warning';
                            else if (msg.startsWith('成功')) type = 'success';
                            appendMessage(msg, type);
                        });
                    } else {
                        appendMessage('收到的回應格式不正確。', 'error');
                    }
                } else {
                    // 處理其他 HTTP 錯誤狀態
                    if (resultMessages && Array.isArray(resultMessages) && resultMessages.length > 0) {
                         resultMessages.forEach(msg => appendMessage(msg, 'error'));
                    } else if (resultMessages && resultMessages.message) {
                        appendMessage(`上傳失敗: ${resultMessages.message} (狀態碼: ${response.status})`, 'error');
                    }
                    else {
                        appendMessage(`上傳失敗，狀態碼: ${response.status}`, 'error');
                    }
                }
            } catch (error) {
                uploadMessagesTitle.style.display = 'block';
                console.error('上傳過程中發生錯誤:', error);
                appendMessage(`客戶端錯誤: ${error.message}`, 'error');
            }
        }

        function appendMessage(message, type = 'info') {
            const listItem = document.createElement('li');
            listItem.textContent = message;
            listItem.className = type; // 用於 CSS 樣式
            messagesDiv.appendChild(listItem);
        }

        async function createManualRecord() {
            console.log("createManualRecord function called");
            const customNo = document.getElementById('manualCustomNo').value;
            const taskType = document.getElementById('manualTaskType').value;
            const inMonth = document.getElementById('manualInMonth').value;
            const income = document.getElementById('manualIncome').value;
            const resultDiv = document.getElementById('manualCreateResult');
            resultDiv.innerHTML = ''; // 清空先前的結果

            console.log("CustomNo:", customNo, "TaskType:", taskType, "InMonth:", inMonth, "Income:", income);

            if (!customNo || income === '') {
                resultDiv.innerHTML = '<span class="error">CustomNo 和 Income 為必填欄位。</span>';
                console.log("Validation failed: CustomNo or Income is empty");
                return;
            }

            const dataToCreate = {
                customNo: customNo,
                taskType: taskType || null, // 如果為空字串，傳遞 null
                inMonth: inMonth || null,   // 如果為空字串，傳遞 null
                income: parseInt(income)    // 確保 income 是數字
            };

            console.log("Data to send:", dataToCreate);

            try {
                const response = await fetch('/api/predict-uploads', { // 端點與控制器中的 @PostMapping 匹配
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(dataToCreate),
                });

                console.log("Response status:", response.status);

                if (response.ok) {
                    const newRecord = await response.json();
                    console.log("Record created successfully:", newRecord);
                    resultDiv.innerHTML = `<span class="success">記錄已成功建立！ ID: ${newRecord.id}, CustomNo: ${newRecord.customNo}</span>`;
                    // 清空輸入欄位 (可選)
                    document.getElementById('manualCustomNo').value = '';
                    document.getElementById('manualTaskType').value = '';
                    document.getElementById('manualInMonth').value = '';
                    document.getElementById('manualIncome').value = '';
                } else {
                    let errorMessage = `建立記錄失敗，狀態碼: ${response.status}`;
                    // 先將響應體讀取為文字
                    const errorText = await response.text();
                    console.log("Error body from server (raw text):", errorText);

                    if (errorText && errorText.trim() !== '') {
                        try {
                            // 嘗試將文字解析為 JSON
                            const errorBodyJson = JSON.parse(errorText);
                            if (errorBodyJson && errorBodyJson.message) {
                                errorMessage += ` - ${errorBodyJson.message}`;
                            } else {
                                // 如果是 JSON 但沒有 message 欄位，或者不是預期的結構，直接使用原始文字
                                errorMessage += ` - ${errorText}`;
                            }
                        } catch (jsonError) {
                            // 如果解析 JSON 失敗，表示它不是 JSON，直接使用原始文字
                            errorMessage += ` - ${errorText}`;
                        }
                    }
                    // 如果 errorText 為空，則不附加額外訊息

                    resultDiv.innerHTML = `<span class="error">${errorMessage}</span>`;
                    console.error("Error creating record:", errorMessage);
                }
            } catch (error) {
                console.error('建立記錄過程中發生客戶端錯誤:', error);
                resultDiv.innerHTML = `<span class="error">客戶端錯誤: ${error.message}</span>`;
            }
        }

        // async function getRecordByCustomNo() {
        //     const customNo = document.getElementById('searchCustomNo').value;
        //     const resultDiv = document.getElementById('getResult');
        //     resultDiv.innerHTML = '<em>(此功能後端未啟用)</em>';
        //     // 實際的 fetch 呼叫到 GET /api/predict-uploads/customNo/{customNo}
        //     console.log("模擬查詢 CustomNo:", customNo);
        // }

        // async function getAllRecords() {
        //     const resultDiv = document.getElementById('getAllResult');
        //     resultDiv.innerHTML = '<em>(此功能後端未啟用)</em>';
        //     // 實際的 fetch 呼叫到 GET /api/predict-uploads
        //     console.log("模擬查詢所有記錄");
        // }
    </script>
</body>
</html>
