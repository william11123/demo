<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>資本資出 前端</title>
    <style>
        body {
            font-family: Arial, ***REMOVED***ns-serif;
            margin: 20px;
            background-color: #f4f4f4;
            color: #333;
        }
        .container {
            background-color: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        h1, h2 {
            color: #333;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }
        input[type="file"], input[type="text"], input[type="number"] {
            margin-bottom: 15px;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
            width: calc(100% - 22px); /* Adjusted for padding and border */
        }
        button {
            background-color: #007bff;
            color: white;
            padding: 10px 15px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            margin-right: 10px; /* Add some margin between buttons */
        }
        button:hover {
            background-color: #0056b3;
        }
        #mes***REMOVED***ges, #exportMes***REMOVED***ges {
            margin-top: 20px;
            padding: 10px;
            border: 1px solid #eee;
            background-color: #f9f9f9;
            border-radius: 4px;
            min-height: 50px;
        }
        #mes***REMOVED***ges ul, #exportMes***REMOVED***ges ul {
            list-style-type: none;
            padding: 0;
        }
        #mes***REMOVED***ges li, #exportMes***REMOVED***ges li {
            padding: 5px 0;
            border-bottom: 1px dashed #eee;
        }
        #mes***REMOVED***ges li:last-child, #exportMes***REMOVED***ges li:last-child {
            border-bottom: none;
        }
        .error {
            color: red;
            font-weight: bold;
        }
        .warning {
            color: orange;
        }
        .success {
            color: green;
        }
        .info {
            color: #31708f; /* Bootstrap info color */
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            width: 120px; /* Adjust as needed */
            display: inline-block;
        }
        .form-group input {
            width: calc(100% - 150px); /* Adjust based on label width */
            display: inline-block;
        }

    </style>
</head>
<body>
    <div class="container">
        <h1>資本資出 資料管理</h1>

        <section id="excel-upload-section">
            <h2>從 Excel 匯入 資本資出 資料</h2>
            <div>
                <label for="excelFile">選擇 Excel 檔案 (.xls 或 .xlsx):</label>
                <input type="file" id="excelFile" name="excelFile" accept=".xls,.xlsx">
            </div>
            <button onclick="uploadExcel()">上傳檔案</button>
            <div id="uploadMes***REMOVED***gesTitle" style="margin-top: 15px; font-weight: bold; display: none;">匯入結果:</div>
            <div id="mes***REMOVED***ges">
                <ul></ul>
            </div>
        </section>

        <section id="create-manual-record-section" style="margin-top: 30px;">
            <h2>手動建立新的資本資出記錄</h2>
            <div class="form-group">
                <label for="manualCustomNo">CustomNo:</label>
                <input type="text" id="manualCustomNo" name="manualCustomNo" required>
            </div>
            <div class="form-group">
                <label for="manualTaskType">TaskType:</label>
                <input type="text" id="manualTaskType" name="manualTaskType">
            </div>
            <div class="form-group">
                <label for="manualInMonth">InMonth:</label>
                <input type="text" id="manualInMonth" name="manualInMonth">
            </div>
            <div class="form-group">
                <label for="manualIncome">Income:</label>
                <input type="number" id="manualIncome" name="manualIncome" required>
            </div>
            <button onclick="createManualRecord()">建立記錄</button>
            <div id="manualCreateResult" style="margin-top: 10px;"></div>
        </section>

        <section id="export-excel-section" style="margin-top: 30px;">
            <h2>根據條件匯出 Excel</h2>
            <div class="form-group">
                <label for="exportCustomNo">CustomNo (模糊):</label>
                <input type="text" id="exportCustomNo" name="exportCustomNo">
            </div>
            <div class="form-group">
                <label for="exportTaskType">TaskType (精確):</label>
                <input type="text" id="exportTaskType" name="exportTaskType">
            </div>
            <div class="form-group">
                <label for="exportInMonth">InMonth (精確):</label>
                <input type="text" id="exportInMonth" name="exportInMonth">
            </div>
            <div class="form-group">
                <label for="exportMinIncome">最低 Income:</label>
                <input type="number" id="exportMinIncome" name="exportMinIncome">
            </div>
            <div class="form-group">
                <label for="exportMaxIncome">最高 Income:</label>
                <input type="number" id="exportMaxIncome" name="exportMaxIncome">
            </div>
            <button onclick="exportToExcel()">匯出 Excel</button>
            <div id="exportMes***REMOVED***ges" style="margin-top: 10px;"><ul></ul></div>
        </section>

                <button onclick="getAllRecords()">查詢全部</button>
                <div id="getAllResult"></div>
            </section>
            -->

    </div>

    <script>
        const mes***REMOVED***gesDiv = document.getElementById('mes***REMOVED***ges').getElementsByTagName('ul')[0];
        const uploadMes***REMOVED***gesTitle = document.getElementById('uploadMes***REMOVED***gesTitle');
        const exportMes***REMOVED***gesDiv = document.getElementById('exportMes***REMOVED***ges').getElementsByTagName('ul')[0];


        async function uploadExcel() {
            const fileInput = document.getElementById('excelFile');
            mes***REMOVED***gesDiv.innerHTML = ''; // 清空先前的訊息
            uploadMes***REMOVED***gesTitle.style.display = 'none';


            if (fileInput.files.length === 0) {
                appendMes***REMOVED***ge(mes***REMOVED***gesDiv, '請先選擇一個檔案。', 'error');
                uploadMes***REMOVED***gesTitle.style.display = 'block';
                return;
            }

            const file = fileInput.files[0];
            const formData = new FormData();
            formData.append('file', file); // 'file' 必須與 @RequestParam("file") 的名稱相符

            try {
                // 確保您的 Spring Boot 應用程式正在執行，並且此 URL 是可訪問的
                const response = await fetch('/api/predict-uploads/upload-excel', {
                    method: 'POST',
                    body: formData,
                    // 不需要 'Content-Type': 'multipart/form-data'，瀏覽器會自動設定
                });

                uploadMes***REMOVED***gesTitle.style.display = 'block';
                const resultMes***REMOVED***ges = await response.json();

                if (response.ok || response.status === 207) { // 207 Multi-Status
                    if (Array.isArray(resultMes***REMOVED***ges)) {
                        resultMes***REMOVED***ges.forEach(msg => {
                            let type = 'info';
                            if (msg.startsWith('錯誤')) type = 'error';
                            else if (msg.startsWith('警告')) type = 'warning';
                            else if (msg.startsWith('成功')) type = 'success';
                            appendMes***REMOVED***ge(mes***REMOVED***gesDiv, msg, type);
                        });
                    } else {
                        appendMes***REMOVED***ge(mes***REMOVED***gesDiv, '收到的回應格式不正確。', 'error');
                    }
                } else {
                    // 處理其他 HTTP 錯誤狀態
                    if (resultMes***REMOVED***ges && Array.isArray(resultMes***REMOVED***ges) && resultMes***REMOVED***ges.length > 0) {
                         resultMes***REMOVED***ges.forEach(msg => appendMes***REMOVED***ge(mes***REMOVED***gesDiv, msg, 'error'));
                    } else if (resultMes***REMOVED***ges && resultMes***REMOVED***ges.mes***REMOVED***ge) {
                        appendMes***REMOVED***ge(mes***REMOVED***gesDiv, `上傳失敗: ${resultMes***REMOVED***ges.mes***REMOVED***ge} (狀態碼: ${response.status})`, 'error');
                    }
                    else {
                        appendMes***REMOVED***ge(mes***REMOVED***gesDiv, `上傳失敗，狀態碼: ${response.status}`, 'error');
                    }
                }
            } catch (error) {
                uploadMes***REMOVED***gesTitle.style.display = 'block';
                console.error('上傳過程中發生錯誤:', error);
                appendMes***REMOVED***ge(mes***REMOVED***gesDiv, `客戶端錯誤: ${error.mes***REMOVED***ge}`, 'error');
            }
        }

        function appendMes***REMOVED***ge(targetDiv, mes***REMOVED***ge, type = 'info') {
            const listItem = document.createElement('li');
            listItem.textContent = mes***REMOVED***ge;
            listItem.className = type; // 用於 CSS 樣式
            targetDiv.appendChild(listItem);
        }

        async function createManualRecord() {
            console.log("createManualRecord function called");
            const customNo = document.getElementById('manualCustomNo').value;
            const taskType = document.getElementById('manualTaskType').value;
            const inMonth = document.getElementById('manualInMonth').value;
            const income = document.getElementById('manualIncome').value;
            const resultDiv = document.getElementById('manualCreateResult');
            resultDiv.innerHTML = ''; // 清空先前的結果

            console.log("CustomNo:", customNo, "TaskType:", taskType, "InMonth:", inMonth, "Income:", income);

            if (!customNo || income === '') { // 確保 CustomNo 和 Income 有值
                resultDiv.innerHTML = '<span class="error">CustomNo 和 Income 為必填欄位。</span>';
                console.log("Validation failed: CustomNo or Income is empty");
                return;
            }
             if (!taskType) {
                resultDiv.innerHTML = '<span class="error">TaskType 為必填欄位。</span>';
                return;
            }
            if (!inMonth) {
                resultDiv.innerHTML = '<span class="error">InMonth 為必填欄位。</span>';
                return;
            }


            const dataToCreate = {
                customNo: customNo,
                taskType: taskType,
                inMonth: inMonth,
                income: parseInt(income)    // 確保 income 是數字
            };

            console.log("Data to send:", dataToCreate);

            try {
                const response = await fetch('/api/predict-uploads', { // 端點與控制器中的 @PostMapping 匹配
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(dataToCreate),
                });

                console.log("Response status:", response.status);

                if (response.ok) {
                    const newRecord = await response.json();
                    console.log("Record created successfully:", newRecord);
                    resultDiv.innerHTML = `<span class="success">記錄已成功建立！ ID: ${newRecord.id}, CustomNo: ${newRecord.customNo}</span>`;
                    // 清空輸入欄位 (可選)
                    document.getElementById('manualCustomNo').value = '';
                    document.getElementById('manualTaskType').value = '';
                    document.getElementById('manualInMonth').value = '';
                    document.getElementById('manualIncome').value = '';
                } else {
                    let errorMes***REMOVED***ge = `建立記錄失敗，狀態碼: ${response.status}`;
                    // 先將響應體讀取為文字
                    const errorText = await response.text();
                    console.log("Error body from server (raw text):", errorText);

                    if (errorText && errorText.trim() !== '') {
                        try {
                            // 嘗試將文字解析為 JSON
                            const errorBodyJson = JSON.parse(errorText);
                            if (errorBodyJson && errorBodyJson.mes***REMOVED***ge) {
                                errorMes***REMOVED***ge += ` - ${errorBodyJson.mes***REMOVED***ge}`;
                            } else {
                                // 如果是 JSON 但沒有 mes***REMOVED***ge 欄位，或者不是預期的結構，直接使用原始文字
                                errorMes***REMOVED***ge += ` - ${errorText}`;
                            }
                        } catch (jsonError) {
                            // 如果解析 JSON 失敗，表示它不是 JSON，直接使用原始文字
                            errorMes***REMOVED***ge += ` - ${errorText}`;
                        }
                    }
                    // 如果 errorText 為空，則不附加額外訊息

                    resultDiv.innerHTML = `<span class="error">${errorMes***REMOVED***ge}</span>`;
                    console.error("Error creating record:", errorMes***REMOVED***ge);
                }
            } catch (error) {
                console.error('建立記錄過程中發生客戶端錯誤:', error);
                resultDiv.innerHTML = `<span class="error">客戶端錯誤: ${error.mes***REMOVED***ge}</span>`;
            }
        }

        async function exportToExcel() {
            exportMes***REMOVED***gesDiv.innerHTML = ''; // 清空先前的匯出訊息

            const customNo = document.getElementById('exportCustomNo').value;
            const taskType = document.getElementById('exportTaskType').value;
            const inMonth = document.getElementById('exportInMonth').value;
            const minIncome = document.getElementById('exportMinIncome').value;
            const maxIncome = document.getElementById('exportMaxIncome').value;

            const queryParams = new URLSearchParams();
            if (customNo) queryParams.append('customNo', customNo);
            if (taskType) queryParams.append('taskType', taskType);
            if (inMonth) queryParams.append('inMonth', inMonth);
            if (minIncome) queryParams.append('minIncome', minIncome);
            if (maxIncome) queryParams.append('maxIncome', maxIncome);

            const queryString = queryParams.toString();
            const exportUrl = `/api/predict-uploads/export${queryString ? '?' + queryString : ''}`;

            appendMes***REMOVED***ge(exportMes***REMOVED***gesDiv, `準備從以下網址匯出: ${exportUrl}`, 'info');

            try {
                const response = await fetch(exportUrl, {
                    method: 'GET',
                });

                if (response.ok) {
                    // 獲取檔名
                    const contentDisposition = response.headers.get('Content-Disposition');
                    let filename = 'exported_data.xlsx'; // 預設檔名
                    if (contentDisposition) {
                        const filenameMatch = contentDisposition.match(/filename="?(.+)"?/i);
                        if (filenameMatch && filenameMatch.length > 1) {
                            filename = filenameMatch[1];
                        }
                    }

                    const blob = await response.blob(); // 將回應轉換為 Blob
                    const downloadUrl = window.URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = downloadUrl;
                    a.download = filename; // 設定下載的檔名
                    document.body.appendChild(a);
                    a.click();
                    a.remove(); // 清理
                    window.URL.revokeObjectURL(downloadUrl); // 釋放 Blob URL
                    appendMes***REMOVED***ge(exportMes***REMOVED***gesDiv, `成功觸發下載: ${filename}`, 'success');
                } else {
                    // 嘗試讀取錯誤訊息 (如果後端有回傳 JSON 錯誤)
                    let errorMsg = `匯出失敗，狀態碼: ${response.status}`;
                    try {
                        const errorData = await response.json();
                        if (errorData && errorData.mes***REMOVED***ge) {
                            errorMsg += ` - ${errorData.mes***REMOVED***ge}`;
                        } else if (errorData) {
                            errorMsg += ` - ${JSON.stringify(errorData)}`;
                        }
                    } catch (e) {
                        // 如果回應不是 JSON，或者解析失敗
                        const textError = await response.text();
                        if (textError) {
                             errorMsg += ` - ${textError}`;
                        }
                    }
                    appendMes***REMOVED***ge(exportMes***REMOVED***gesDiv, errorMsg, 'error');
                    console.error('匯出錯誤:', errorMsg);
                }
            } catch (error) {
                console.error('匯出過程中發生客戶端錯誤:', error);
                appendMes***REMOVED***ge(exportMes***REMOVED***gesDiv, `客戶端錯誤: ${error.mes***REMOVED***ge}`, 'error');
            }
        }

        // async function getRecordByCustomNo() {
        //     const customNo = document.getElementById('searchCustomNo').value;
        //     const resultDiv = document.getElementById('getResult');
        //     resultDiv.innerHTML = '<em>(此功能後端未啟用)</em>';

        // }

        //     const resultDiv = document.getElementById('getAllResult');
        //     resultDiv.innerHTML = '<em>(此功能後端未啟用)</em>';

        //     console.log("模擬查詢所有記錄");
        // }
    </script>
</body>
