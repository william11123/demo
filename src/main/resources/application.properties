spring.application.name=demo
# server.port=8090
# filepath: src/main/resources/application.properties
# MS SQL Server DataSource
spring.datasource.url=jdbc:sqlserver://10.105.3.55;databaseName=csms;encrypt=false;trustServerCertificate=true;
spring.datasource.username=***REMOVED***
spring.datasource.password=***REMOVED***
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# JPA Properties (可選, 如果使用 Spring Data JPA)
spring.jpa.hibernate.ddl-auto=update 
# 可選值: none, update, create, create-drop，在生產環境應該使用none
spring.jpa.show-sql=true
#spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServer2012Dialect # 早期版本可能需要 SQLServer2012Dialect 或更新版本

# 設定 Hibernate 的物理命名策略，使其直接使用註解中定義的名稱
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl