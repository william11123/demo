<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>合約報表匯出</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', 'Noto Sans TC', sans-serif; }
        .btn-disabled { cursor: not-allowed; opacity: 0.5; }
    </style>
</head>
<body class="bg-gray-100 text-gray-800 flex items-center justify-center min-h-screen">

    <div class="container mx-auto p-4 md:p-8 max-w-2xl">
        <div class="bg-white rounded-lg shadow-xl p-8 mb-6">
            <h1 class="text-3xl font-bold mb-4 text-gray-800">合約報表匯出</h1>
            <p class="text-gray-600 mb-8">請選擇要匯出的完工日期區間，然後點擊對應的按鈕來下載報表。</p>
            
            <div class="space-y-6">
                <div>
                    <label for="start-date-input" class="block mb-2 text-sm font-medium text-gray-700">開始日期</label>
                    <input type="date" id="start-date-input" class="w-full bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block p-2.5" value="2022-01-01">
                </div>
                <div>
                    <label for="end-date-input" class="block mb-2 text-sm font-medium text-gray-700">結束日期 (不含)</label>
                    <input type="date" id="end-date-input" class="w-full bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block p-2.5" value="2025-08-01">
                </div>
            </div>

            <!-- 訊息提示區 -->
            <div id="message-area" class="mt-6 text-center h-6"></div>

            <!-- 按鈕組 -->
            <div class="mt-6 grid grid-cols-1 md:grid-cols-2 gap-4">
                 <button onclick="handleExport('lease')" id="export-lease-btn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-5 rounded-lg transition duration-300 ease-in-out">
                    匯出租賃報表
                </button>
                 <button onclick="handleExport('non-lease')" id="export-non-lease-btn" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-3 px-5 rounded-lg transition duration-300 ease-in-out">
                    匯出非租賃報表
                </button>
            </div>
        </div>

        <div class="mt-6 text-center">
            <a href="/welcome" class="text-blue-600 hover:underline">返回首頁</a>
        </div>
    </div>

    <script>
        const startDateInput = document.getElementById('start-date-input');
        const endDateInput = document.getElementById('end-date-input');
        const leaseBtn = document.getElementById('export-lease-btn');
        const nonLeaseBtn = document.getElementById('export-non-lease-btn');
        const messageArea = document.getElementById('message-area');

        function showMessage(message, isError = false) {
            messageArea.textContent = message;
            messageArea.className = isError ? 'text-center h-6 text-red-600' : 'text-center h-6 text-blue-600';
        }

        function clearMessage() {
            messageArea.textContent = '';
        }
        
        function setButtonsDisabled(disabled) {
            leaseBtn.disabled = disabled;
            nonLeaseBtn.disabled = disabled;
            if(disabled) {
                leaseBtn.classList.add('btn-disabled');
                nonLeaseBtn.classList.add('btn-disabled');
            } else {
                leaseBtn.classList.remove('btn-disabled');
                nonLeaseBtn.classList.remove('btn-disabled');
            }
        }

        function handleExport(type) {
            clearMessage();
            const startDate = startDateInput.value;
            const endDate = endDateInput.value;

            // 1. 輸入驗證
            if (!startDate || !endDate) {
                showMessage('請選擇開始和結束日期', true);
                return;
            }
            if (startDate >= endDate) {
                showMessage('開始日期必須早於結束日期', true);
                return;
            }

            // 2. 顯示提示訊息並禁用按鈕
            showMessage('正在準備匯出檔案，請稍候...');
            setButtonsDisabled(true);
            
            // 3. 觸發下載，並帶上 type 參數
            window.location.href = `/export-lease-contract?startDate=${startDate}&endDate=${endDate}&type=${type}`;

            // 4. 短暫延遲後重新啟用按鈕
            setTimeout(() => {
                clearMessage();
                setButtonsDisabled(false);
            }, 5000); // 5秒後自動恢復按鈕功能
        }
    </script>
</body>
</html>
