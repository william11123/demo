<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>銀行資訊查詢</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', 'Noto Sans TC', ***REMOVED***ns-serif;
        }
        /* 讓按鈕在禁用時有更明顯的樣式 */
        .btn-di***REMOVED***bled {
            cursor: not-allowed;
            opacity: 0.5;
        }
        /* 自訂提示框樣式 */
        #custom-alert-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        #custom-alert-box {
            background-color: white;
            padding: 24px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 90%;
            width: 400px;
        }
    </style>
</head>
<body class="bg-gray-100 text-gray-800">

    <!-- 自訂提示框 HTML 結構 -->
    <div id="custom-alert-overlay" class="hidden">
        <div id="custom-alert-box">
            <p id="custom-alert-mes***REMOVED***ge" class="mb-4 text-gray-700"></p>
            <button id="custom-alert-ok-btn" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-6 rounded-lg">確定</button>
        </div>
    </div>

    <div class="container mx-auto p-4 md:p-8">
        <div class="bg-white rounded-lg shadow-md p-6 mb-6">
            <h1 class="text-2xl font-bold mb-4 text-gray-700">銀行資訊查詢</h1>
            <p class="text-gray-600 mb-4">請選擇完工月份的區間進行查詢。</p>
            <div class="flex flex-wrap items-end gap-4">
                <div class="flex-grow sm:flex-grow-0">
                    <label for="start-month-input" class="block mb-1 text-sm font-medium text-gray-700">開始月份</label>
                    <input type="month" id="start-month-input" class="w-full bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block p-2.5" value="2025-01">
                </div>
                <div class="flex-grow sm:flex-grow-0">
                    <label for="end-month-input" class="block mb-1 text-sm font-medium text-gray-700">結束月份</label>
                    <input type="month" id="end-month-input" class="w-full bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block p-2.5" value="2025-05">
                </div>
                <button id="query-btn" class="w-full sm:w-auto bg-blue-600 hover:bg-blue-700 text-white font-bold py-2.5 px-5 rounded-lg transition duration-300 ease-in-out">
                    查詢
                </button>
                <button id="export-btn" class="w-full sm:w-auto bg-green-600 hover:bg-green-700 text-white font-bold py-2.5 px-5 rounded-lg transition duration-300 ease-in-out btn-di***REMOVED***bled" di***REMOVED***bled>
                    匯出 Excel
                </button>
            </div>
             <div id="loading" class="mt-4 text-center" style="display: none;">
                <p class="text-blue-600">查詢中，請稍候...</p>
            </div>
        </div>

        <div class="bg-white rounded-lg shadow-md overflow-x-auto">
            <table class="w-full text-sm text-left text-gray-600">
                <thead class="text-xs text-gray-700 uppercase bg-gray-50">
                    <tr>
                        <th scope="col" class="px-6 py-3">銀行名稱</th>
                        <th scope="col" class="px-6 py-3">分行名稱</th>
                        <th scope="col" class="px-6 py-3">地址</th>
                        <th scope="col" class="px-6 py-3">銷售負責人</th>
                        <th scope="col" class="px-6 py-3">電話一</th>
                        <th scope="col" class="px-6 py-3">電話二</th>
                        <th scope="col" class="px-6 py-3">完工月份</th>
                    </tr>
                </thead>
                <tbody id="results-table-body">
                    <!-- 查詢結果將會動態插入此處 -->
                </tbody>
            </table>
            <div id="no-results" class="p-6 text-center text-gray-500">
                <p>請點擊「查詢」按鈕以顯示結果。</p>
            </div>
        </div>
        <div class="mt-6 text-center">
            <a href="/welcome" class="text-blue-600 hover:underline">返回首頁</a>
        </div>
    </div>

    <script>
        const startMonthInput = document.getElementById('start-month-input');
        const endMonthInput = document.getElementById('end-month-input');
        const queryBtn = document.getElementById('query-btn');
        const exportBtn = document.getElementById('export-btn');
        const tableBody = document.getElementById('results-table-body');
        const loadingIndicator = document.getElementById('loading');
        const noResultsMes***REMOVED***ge = document.getElementById('no-results');

        // 自訂提示框相關元素
        const alertOverlay = document.getElementById('custom-alert-overlay');
        const alertMes***REMOVED***ge = document.getElementById('custom-alert-mes***REMOVED***ge');
        const alertOkBtn = document.getElementById('custom-alert-ok-btn');

        // 顯示自訂提示框的函式
        function showAlert(mes***REMOVED***ge) {
            alertMes***REMOVED***ge.textContent = mes***REMOVED***ge;
            alertOverlay.classList.remove('hidden');
        }

        // 隱藏自訂提示框
        alertOkBtn.addEventListener('click', () => {
            alertOverlay.classList.add('hidden');
        });

        function performQuery() {
            const startMonth = startMonthInput.value;
            const endMonth = endMonthInput.value;

            if (!startMonth || !endMonth) {
                showAlert('請選擇開始和結束月份');
                return;
            }
            if (startMonth > endMonth) {
                showAlert('開始月份不能晚於結束月份');
                return;
            }

            // 清空舊資料並顯示載入指示
            tableBody.innerHTML = '';
            loadingIndicator.style.display = 'block';
            noResultsMes***REMOVED***ge.style.display = 'none';
            // 查詢時禁用匯出按鈕
            exportBtn.di***REMOVED***bled = true;
            exportBtn.classList.add('btn-di***REMOVED***bled');

            // 呼叫後端 API
            fetch(`/api/bank-info?startMonth=${startMonth}&endMonth=${endMonth}`)
                .then(response => {
                    if (!response.ok) throw new Error(`HTTP 錯誤！ 狀態: ${response.status}`);
                    return response.json();
                })
                .then(data => {
                    loadingIndicator.style.display = 'none';
                    if (data && data.length > 0) {
                        data.forEach(item => {
                            const escape = (str) => str ? String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#039;') : '';
                            const row = `
                                <tr class="bg-white border-b hover:bg-gray-50">
                                    <td class="px-6 py-4">${escape(item.bankname)}</td>
                                    <td class="px-6 py-4">${escape(item.nickName)}</td>
                                    <td class="px-6 py-4">${escape(item.addr)}</td>
                                    <td class="px-6 py-4">${escape(item.***REMOVED***leLia)}</td>
                                    <td class="px-6 py-4">${escape(item.tel1)}</td>
                                    <td class="px-6 py-4">${escape(item.tel2)}</td>
                                    <td class="px-6 py-4">${escape(item.compMonth)}</td>
                                </tr>
                            `;
                            tableBody.innerHTML += row;
                        });
                        // 有資料時啟用匯出按鈕
                        exportBtn.di***REMOVED***bled = false;
                        exportBtn.classList.remove('btn-di***REMOVED***bled');
                    } else {
                         noResultsMes***REMOVED***ge.style.display = 'block';
                         noResultsMes***REMOVED***ge.textContent = '找不到符合條件的資料。';
                    }
                })
                .catch(error => {
                    loadingIndicator.style.display = 'none';
                    noResultsMes***REMOVED***ge.style.display = 'block';
                    noResultsMes***REMOVED***ge.textContent = '查詢資料時發生錯誤。';
                    console.error('Fetch 錯誤:', error);
                    showAlert('查詢資料時發生錯誤，請檢查主控台以獲取更多資訊。');
                });
        }

        queryBtn.addEventListener('click', performQuery);

        exportBtn.addEventListener('click', () => {
            const startMonth = startMonthInput.value;
            const endMonth = endMonthInput.value;

            if (!startMonth || !endMonth) {
                showAlert('請選擇開始和結束月份');
                return;
            }
             if (startMonth > endMonth) {
                showAlert('開始月份不能晚於結束月份');
                return;
            }
            // 直接導向到匯出 URL，瀏覽器會自動處理下載
            window.location.href = `/api/bank-info/export?startMonth=${startMonth}&endMonth=${endMonth}`;
        });
        
    </script>
</body>
</html>
