<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>銀行資訊匯出</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', 'Noto Sans TC', ***REMOVED***ns-serif; }
        .btn-di***REMOVED***bled { cursor: not-allowed; opacity: 0.5; }
    </style>
</head>
<body class="bg-gray-100 text-gray-800 flex items-center justify-center min-h-screen">

    <div class="container mx-auto p-4 md:p-8 max-w-2xl">
        <div class="bg-white rounded-lg shadow-md p-8 mb-6">
            <h1 class="text-2xl font-bold mb-4 text-gray-700">銀行資訊匯出</h1>
            <p class="text-gray-600 mb-8">請選擇要匯出的完工月份區間，然後點擊「匯出 Excel」按鈕。</p>
            
            <div class="space-y-6">
                <div>
                    <label for="start-month-input" class="block mb-2 text-sm font-medium text-gray-700">開始月份</label>
                    <input type="month" id="start-month-input" class="w-full bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block p-2.5" value="2025-01">
                </div>
                <div>
                    <label for="end-month-input" class="block mb-2 text-sm font-medium text-gray-700">結束月份</label>
                    <input type="month" id="end-month-input" class="w-full bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block p-2.5" value="2025-05">
                </div>
            </div>

            <!-- 訊息提示區 -->
            <div id="mes***REMOVED***ge-area" class="mt-6 text-center h-6"></div>

            <button id="export-btn" class="w-full mt-4 bg-green-600 hover:bg-green-700 text-white font-bold py-3 px-5 rounded-lg transition duration-300 ease-in-out">
                匯出 Excel
            </button>
        </div>

        <div class="mt-6 text-center">
            <a href="/welcome" class="text-blue-600 hover:underline">返回首頁</a>
        </div>
    </div>

    <script>
        const startMonthInput = document.getElementById('start-month-input');
        const endMonthInput = document.getElementById('end-month-input');
        const exportBtn = document.getElementById('export-btn');
        const mes***REMOVED***geArea = document.getElementById('mes***REMOVED***ge-area');

        function showMes***REMOVED***ge(mes***REMOVED***ge, isError = false) {
            mes***REMOVED***geArea.textContent = mes***REMOVED***ge;
            mes***REMOVED***geArea.className = isError ? 'text-center h-6 text-red-600' : 'text-center h-6 text-blue-600';
        }

        function clearMes***REMOVED***ge() {
            mes***REMOVED***geArea.textContent = '';
        }

        exportBtn.addEventListener('click', () => {
            clearMes***REMOVED***ge();
            const startMonth = startMonthInput.value;
            const endMonth = endMonthInput.value;

            // 1. 輸入驗證
            if (!startMonth || !endMonth) {
                showMes***REMOVED***ge('請選擇開始和結束月份', true);
                return;
            }
            if (startMonth > endMonth) {
                showMes***REMOVED***ge('開始月份不能晚於結束月份', true);
                return;
            }

            // 2. 顯示提示訊息並禁用按鈕
            showMes***REMOVED***ge('正在準備匯出檔案，請稍候...');
            exportBtn.di***REMOVED***bled = true;
            exportBtn.classList.add('btn-di***REMOVED***bled');

            // 3. 觸發下載
            window.location.href = `/api/bank-info/export?startMonth=${startMonth}&endMonth=${endMonth}`;

            // 4. 為了防止使用者在下載期間重複點擊，我們在短暫延遲後重新啟用按鈕。
            //    這是一個簡單的處理方式，因為我們無法確切知道下載何時開始或完成。
            setTimeout(() => {
                clearMes***REMOVED***ge();
                exportBtn.di***REMOVED***bled = false;
                exportBtn.classList.remove('btn-di***REMOVED***bled');
            }, 5000); // 5秒後自動恢復按鈕功能
        });
    </script>
</body>
</html>
