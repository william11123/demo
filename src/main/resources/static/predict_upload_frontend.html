<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <!-- 基本設定：編碼、視窗、標題 -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>資本資出 管理系統</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, ***REMOVED***ns-serif;
            background: linear-gradient(135deg, #0c0c0c 0%, #1a1a2e 50%, #16213e 100%);
            color: #e0e6ed;
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }

        /* 科技感背景動畫 */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                radial-gradient(circle at 20% 80%, rgba(120, 119, 198, 0.3) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(255, 119, 198, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 40% 40%, rgba(120, 200, 255, 0.1) 0%, transparent 50%);
            animation: backgroundPulse 10s ease-in-out infinite alternate;
            z-index: -1;
        }

        @keyframes backgroundPulse {
            0% { opacity: 0.5; }
            100% { opacity: 1; }
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            position: relative;
            z-index: 1;
        }

        h1 {
            text-align: center;
            font-size: 2.5rem;
            font-weight: 300;
            margin-bottom: 3rem;
            background: linear-gradient(45deg, #00d4ff, #007bff, #ff6b6b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 0 30px rgba(0, 212, 255, 0.5);
            position: relative;
        }

        h1::after {
            content: '';
            position: absolute;
            bottom: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 200px;
            height: 2px;
            background: linear-gradient(90deg, transparent, #00d4ff, transparent);
            animation: lineGlow 2s ease-in-out infinite alternate;
        }

        @keyframes lineGlow {
            0% { opacity: 0.5; width: 100px; }
            100% { opacity: 1; width: 200px; }
        }

        section {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 2rem;
            margin-bottom: 2rem;
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
        }

        section::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.1), transparent);
            transition: left 0.5s;
        }

        section:hover::before {
            left: 100%;
        }

        section:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 40px rgba(0, 212, 255, 0.3);
            border-color: rgba(0, 212, 255, 0.5);
        }

        h2 {
            color: #00d4ff;
            font-size: 1.5rem;
            font-weight: 400;
            margin-bottom: 1.5rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        h2::before {
            content: '◆';
            color: #ff6b6b;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .form-group {
            margin-bottom: 1.5rem;
            position: relative;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
            color: #a0aec0;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        input[type="file"], input[type="text"], input[type="number"] {
            width: 100%;
            padding: 12px 16px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            color: #e0e6ed;
            font-size: 1rem;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }

        input[type="file"]:focus, input[type="text"]:focus, input[type="number"]:focus {
            outline: none;
            border-color: #00d4ff;
            box-shadow: 0 0 20px rgba(0, 212, 255, 0.3);
            background: rgba(255, 255, 255, 0.15);
        }

        input::placeholder {
            color: rgba(160, 174, 192, 0.7);
        }

        .button-group {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            margin: 1.5rem 0;
        }

        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 12px 24px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 500;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            min-width: 120px;
        }

        button::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.5s;
        }

        button:hover::before {
            left: 100%;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
            background: linear-gradient(135deg, #764ba2 0%, #667eea 100%);
        }

        button:active {
            transform: translateY(0);
        }

        /* 特殊按鈕樣式 */
        button:nth-child(1) {
            background: linear-gradient(135deg, #ff6b6b 0%, #ffa500 100%);
        }

        button:nth-child(1):hover {
            background: linear-gradient(135deg, #ffa500 0%, #ff6b6b 100%);
            box-shadow: 0 10px 25px rgba(255, 107, 107, 0.4);
        }

        button:nth-child(2) {
            background: linear-gradient(135deg, #00d4ff 0%, #0099cc 100%);
        }

        button:nth-child(2):hover {
            background: linear-gradient(135deg, #0099cc 0%, #00d4ff 100%);
            box-shadow: 0 10px 25px rgba(0, 212, 255, 0.4);
        }

        /* 訊息區域 */
        #mes***REMOVED***ges, #exportMes***REMOVED***ges, #searchResults {
            margin-top: 20px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            padding: 15px;
            min-height: 60px;
            backdrop-filter: blur(10px);
        }

        #mes***REMOVED***ges ul, #exportMes***REMOVED***ges ul, #searchResults ul {
            list-style-type: none;
            padding: 0;
        }

        #mes***REMOVED***ges li, #exportMes***REMOVED***ges li, #searchResults li {
            padding: 8px 12px;
            margin: 5px 0;
            border-radius: 5px;
            border-left: 3px solid;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(-20px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .error {
            color: #ff6b6b;
            background: rgba(255, 107, 107, 0.1);
            border-left-color: #ff6b6b;
        }

        .warning {
            color: #ffa500;
            background: rgba(255, 165, 0, 0.1);
            border-left-color: #ffa500;
        }

        .success {
            color: #00ff88;
            background: rgba(0, 255, 136, 0.1);
            border-left-color: #00ff88;
        }

        .info {
            color: #00d4ff;
            background: rgba(0, 212, 255, 0.1);
            border-left-color: #00d4ff;
        }

        /* 文件上傳區域特殊樣式 */
        input[type="file"] {
            background: linear-gradient(135deg, rgba(0, 212, 255, 0.1), rgba(102, 126, 234, 0.1));
            border: 2px dashed rgba(0, 212, 255, 0.3);
            transition: all 0.3s ease;
        }

        input[type="file"]:hover {
            border-color: #00d4ff;
            background: linear-gradient(135deg, rgba(0, 212, 255, 0.2), rgba(102, 126, 234, 0.2));
        }

        /* 隱藏的標題動畫 */
        #uploadMes***REMOVED***gesTitle {
            color: #00d4ff;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* 響應式設計 */
        @media (max-width: 768px) {
            .container {
                padding: 15px;
            }

            h1 {
                font-size: 2rem;
            }

            section {
                padding: 1.5rem;
            }

            .button-group {
                flex-direction: column;
            }

            button {
                width: 100%;
            }
        }

        /* 載入動畫 */
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .loading {
            position: relative;
        }

        .loading::after {
            content: '';
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top: 2px solid #00d4ff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        /* 滾動條樣式 */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.1);
        }

        ::-webkit-scrollbar-thumb {
            background: linear-gradient(135deg, #00d4ff, #667eea);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: linear-gradient(135deg, #667eea, #00d4ff);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>資本資出 管理系統</h1>

        <section id="excel-upload-section">
            <h2>從 Excel 匯入資料</h2>
            <div class="form-group">
                <label for="excelFile">選擇 Excel 檔案 (.xls 或 .xlsx)</label>
                <input type="file" id="excelFile" name="excelFile" accept=".xls,.xlsx">
            </div>
            <div class="button-group">
                <button onclick="uploadExcel()">上傳檔案</button>
            </div>
            <div id="uploadMes***REMOVED***gesTitle" style="margin-top: 15px; font-weight: bold; display: none;">匯入結果</div>
            <div id="mes***REMOVED***ges">
                <ul></ul>
            </div>
        </section>

        <section id="create-manual-record-section">
            <h2>手動建立記錄</h2>
            <div class="form-group">
                <label for="manualCustomNo">CustomNo</label>
                <input type="text" id="manualCustomNo" name="manualCustomNo" placeholder="請輸入客戶編號" required>
            </div>
            <div class="form-group">
                <label for="manualTaskType">TaskType</label>
                <input type="text" id="manualTaskType" name="manualTaskType" placeholder="請輸入任務類型">
            </div>
            <div class="form-group">
                <label for="manualInMonth">InMonth</label>
                <input type="text" id="manualInMonth" name="manualInMonth" placeholder="例如：2024-01">
            </div>
            <div class="form-group">
                <label for="manualIncome">Income</label>
                <input type="number" id="manualIncome" name="manualIncome" placeholder="請輸入收入金額" required>
            </div>
            <div class="button-group">
                <button onclick="createManualRecord()">建立記錄</button>
            </div>
            <div id="manualCreateResult" style="margin-top: 10px;"></div>
        </section>

        <section id="export-excel-section">
            <h2>查詢和匯出功能</h2>
            <div class="form-group">
                <label for="exportCustomNo">CustomNo</label>
                <input type="text" id="exportCustomNo" name="exportCustomNo" placeholder="客戶編號（可選）">
            </div>
            <div class="form-group">
                <label for="exportTaskType">TaskType</label>
                <input type="text" id="exportTaskType" name="exportTaskType" placeholder="任務類型（可選）">
            </div>
            <div class="form-group">
                <label for="exportInMonth">InMonth</label>
                <input type="text" id="exportInMonth" name="exportInMonth" placeholder="月份（可選）">
            </div>
            
            <div class="button-group">
                <button onclick="exportToExcel()">匯出 Excel</button>
                <button onclick="search()">查詢資料</button>
            </div>
            
            <div id="exportMes***REMOVED***ges"><ul></ul></div>
            <div id="searchResults"><ul></ul></div>
        </section>

    </div>

    <script>
        const mes***REMOVED***gesDiv = document.getElementById('mes***REMOVED***ges').getElementsByTagName('ul')[0];
        const uploadMes***REMOVED***gesTitle = document.getElementById('uploadMes***REMOVED***gesTitle');
        const exportMes***REMOVED***gesDiv = document.getElementById('exportMes***REMOVED***ges').getElementsByTagName('ul')[0];

        async function uploadExcel() {
            const fileInput = document.getElementById('excelFile');
            const uploadButton = fileInput.parentElement.parentElement.querySelector('button');
            
            mes***REMOVED***gesDiv.innerHTML = '';
            uploadMes***REMOVED***gesTitle.style.display = 'none';

            if (fileInput.files.length === 0) {
                appendMes***REMOVED***ge(mes***REMOVED***gesDiv, '請先選擇一個檔案。', 'error');
                uploadMes***REMOVED***gesTitle.style.display = 'block';
                return;
            }

            // 添加載入動畫
            uploadButton.classList.add('loading');
            uploadButton.di***REMOVED***bled = true;

            const file = fileInput.files[0];
            const formData = new FormData();
            formData.append('file', file);

            try {
                const response = await fetch('/api/predict-uploads/upload-excel', {
                    method: 'POST',
                    body: formData,
                });

                uploadMes***REMOVED***gesTitle.style.display = 'block';
                const resultMes***REMOVED***ges = await response.json();

                if (response.ok || response.status === 207) {
                    if (Array.isArray(resultMes***REMOVED***ges)) {
                        resultMes***REMOVED***ges.forEach(msg => {
                            let type = 'info';
                            if (msg.startsWith('錯誤')) type = 'error';
                            else if (msg.startsWith('警告')) type = 'warning';
                            else if (msg.startsWith('成功')) type = 'success';
                            appendMes***REMOVED***ge(mes***REMOVED***gesDiv, msg, type);
                        });
                    } else {
                        appendMes***REMOVED***ge(mes***REMOVED***gesDiv, '收到的回應格式不正確。', 'error');
                    }
                } else {
                    if (resultMes***REMOVED***ges && Array.isArray(resultMes***REMOVED***ges) && resultMes***REMOVED***ges.length > 0) {
                         resultMes***REMOVED***ges.forEach(msg => appendMes***REMOVED***ge(mes***REMOVED***gesDiv, msg, 'error'));
                    } else if (resultMes***REMOVED***ges && resultMes***REMOVED***ges.mes***REMOVED***ge) {
                        appendMes***REMOVED***ge(mes***REMOVED***gesDiv, `上傳失敗: ${resultMes***REMOVED***ges.mes***REMOVED***ge} (狀態碼: ${response.status})`, 'error');
                    } else {
                        appendMes***REMOVED***ge(mes***REMOVED***gesDiv, `上傳失敗，狀態碼: ${response.status}`, 'error');
                    }
                }
            } catch (error) {
                uploadMes***REMOVED***gesTitle.style.display = 'block';
                console.error('上傳過程中發生錯誤:', error);
                appendMes***REMOVED***ge(mes***REMOVED***gesDiv, `客戶端錯誤: ${error.mes***REMOVED***ge}`, 'error');
            } finally {
                // 移除載入動畫
                uploadButton.classList.remove('loading');
                uploadButton.di***REMOVED***bled = false;
            }
        }

        function appendMes***REMOVED***ge(targetDiv, mes***REMOVED***ge, type = 'info') {
            const listItem = document.createElement('li');
            listItem.textContent = mes***REMOVED***ge;
            listItem.className = type;
            targetDiv.appendChild(listItem);
        }

        async function search() {
            const searchDiv = document.getElementById('searchResults').getElementsByTagName('ul')[0];
            const searchButton = document.querySelector('button[onclick="search()"]');
            
            searchDiv.innerHTML = '';
            searchButton.classList.add('loading');
            searchButton.di***REMOVED***bled = true;

            const customNo = document.getElementById('exportCustomNo').value;
            const taskType = document.getElementById('exportTaskType').value;
            const inMonth = document.getElementById('exportInMonth').value;

            const queryParams = new URLSearchParams();
            if (customNo) queryParams.append('customNo', customNo);
            if (taskType) queryParams.append('taskType', taskType);
            if (inMonth) queryParams.append('inMonth', inMonth);

            const queryString = queryParams.toString();
            const searchUrl = `/api/predict-uploads${queryString ? '?' + queryString : ''}`;

            try {
                const response = await fetch(searchUrl, {
                    method: 'GET',
                });

                if (response.ok) {
                    const results = await response.json();
                    if (Array.isArray(results) && results.length > 0) {
                        results.forEach(record => {
                            appendMes***REMOVED***ge(searchDiv, 
                                `CustomNo: ${record.customNo}, TaskType: ${record.taskType}, InMonth: ${record.inMonth}, Income: ${record.income}`, 
                                'info');
                        });
                    } else {
                        appendMes***REMOVED***ge(searchDiv, '沒有找到符合條件的記錄', 'warning');
                    }
                } else {
                    appendMes***REMOVED***ge(searchDiv, `查詢失敗，狀態碼: ${response.status}`, 'error');
                }
            } catch (error) {
                appendMes***REMOVED***ge(searchDiv, `查詢錯誤: ${error.mes***REMOVED***ge}`, 'error');
            } finally {
                searchButton.classList.remove('loading');
                searchButton.di***REMOVED***bled = false;
            }
        }

        async function createManualRecord() {
            const button = document.querySelector('button[onclick="createManualRecord()"]');
            button.classList.add('loading');
            button.di***REMOVED***bled = true;

            console.log("createManualRecord function called");
            const customNo = document.getElementById('manualCustomNo').value;
            const taskType = document.getElementById('manualTaskType').value;
            const inMonth = document.getElementById('manualInMonth').value;
            const income = document.getElementById('manualIncome').value;
            const resultDiv = document.getElementById('manualCreateResult');
            resultDiv.innerHTML = '';

            console.log("CustomNo:", customNo, "TaskType:", taskType, "InMonth:", inMonth, "Income:", income);

            if (!customNo || income === '') {
                resultDiv.innerHTML = '<span class="error">CustomNo 和 Income 為必填欄位。</span>';
                console.log("Validation failed: CustomNo or Income is empty");
                button.classList.remove('loading');
                button.di***REMOVED***bled = false;
                return;
            }
             if (!taskType) {
                resultDiv.innerHTML = '<span class="error">TaskType 為必填欄位。</span>';
                button.classList.remove('loading');
                button.di***REMOVED***bled = false;
                return;
            }
            if (!inMonth) {
                resultDiv.innerHTML = '<span class="error">InMonth 為必填欄位。</span>';
                button.classList.remove('loading');
                button.di***REMOVED***bled = false;
                return;
            }

            const dataToCreate = {
                customNo: customNo,
                taskType: taskType,
                inMonth: inMonth,
                income: parseInt(income)
            };

            console.log("Data to send:", dataToCreate);

            try {
                const response = await fetch('/api/predict-uploads', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(dataToCreate),
                });

                console.log("Response status:", response.status);

                if (response.ok) {
                    const newRecord = await response.json();
                    console.log("Record created successfully:", newRecord);
                    resultDiv.innerHTML = `<span class="success">記錄已成功建立！ ID: ${newRecord.id}, CustomNo: ${newRecord.customNo}</span>`;
                    
                    document.getElementById('manualCustomNo').value = '';
                    document.getElementById('manualTaskType').value = '';
                    document.getElementById('manualInMonth').value = '';
                    document.getElementById('manualIncome').value = '';
                } else {
                    let errorMes***REMOVED***ge = `建立記錄失敗，狀態碼: ${response.status}`;
                    const errorText = await response.text();
                    console.log("Error body from server (raw text):", errorText);

                    if (errorText && errorText.trim() !== '') {
                        try {
                            const errorBodyJson = JSON.parse(errorText);
                            if (errorBodyJson && errorBodyJson.mes***REMOVED***ge) {
                                errorMes***REMOVED***ge += ` - ${errorBodyJson.mes***REMOVED***ge}`;
                            } else {
                                errorMes***REMOVED***ge += ` - ${errorText}`;
                            }
                        } catch (jsonError) {
                            errorMes***REMOVED***ge += ` - ${errorText}`;
                        }
                    }

                    resultDiv.innerHTML = `<span class="error">${errorMes***REMOVED***ge}</span>`;
                    console.error("Error creating record:", errorMes***REMOVED***ge);
                }
            } catch (error) {
                console.error('建立記錄過程中發生客戶端錯誤:', error);
                resultDiv.innerHTML = `<span class="error">客戶端錯誤: ${error.mes***REMOVED***ge}</span>`;
            } finally {
                button.classList.remove('loading');
                button.di***REMOVED***bled = false;
            }
        }

        async function exportToExcel() {
            const exportButton = document.querySelector('button[onclick="exportToExcel()"]');
            exportButton.classList.add('loading');
            exportButton.di***REMOVED***bled = true;

            exportMes***REMOVED***gesDiv.innerHTML = '';

            const customNo = document.getElementById('exportCustomNo').value;
            const taskType = document.getElementById('exportTaskType').value;
            const inMonth = document.getElementById('exportInMonth').value;
           
            const queryParams = new URLSearchParams();
            if (customNo) queryParams.append('customNo', customNo);
            if (taskType) queryParams.append('taskType', taskType);
            if (inMonth) queryParams.append('inMonth', inMonth);
           
            const queryString = queryParams.toString();
            const exportUrl = `/api/predict-uploads/export${queryString ? '?' + queryString : ''}`;

            appendMes***REMOVED***ge(exportMes***REMOVED***gesDiv, `準備從以下網址匯出: ${exportUrl}`, 'info');

            try {
                const response = await fetch(exportUrl, {
                    method: 'GET',
                });

                if (response.ok) {
                    const contentDisposition = response.headers.get('Content-Disposition');
                    let filename = 'exported_data.xlsx';
                    if (contentDisposition) {
                        const filenameMatch = contentDisposition.match(/filename="?(.+)"?/i);
                        if (filenameMatch && filenameMatch.length > 1) {
                            filename = filenameMatch[1];
                        }
                    }

                    const blob = await response.blob();
                    const downloadUrl = window.URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = downloadUrl;
                    a.download = filename;
                    document.body.appendChild(a);
                    a.click();
                    a.remove();
                    window.URL.revokeObjectURL(downloadUrl);
                    appendMes***REMOVED***ge(exportMes***REMOVED***gesDiv, `成功觸發下載: ${filename}`, 'success');
                } else {
